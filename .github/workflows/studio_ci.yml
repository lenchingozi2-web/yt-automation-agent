name: Studio checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --experimental-strip-types --test tests/studio.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m py_compile worker.py studio_audio.py studio_automation.py studio_media.py studio_thumbnail_art.py studio_maintenance.py
      - run: python3 -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: PYTHONPATH=. python3 tests/test_studio_media.py
      - run: PYTHONPATH=. python3 tests/test_studio_thumbnail_art.py
      - run: PYTHONPATH=. python3 tests/test_retention.py
      - run: python3 -m unittest discover -s tests -p "test_pipeline.py" -v
