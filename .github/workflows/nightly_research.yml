name: LenxiQ Daily Briefing
on:
  schedule:
    - cron: '8 3 * * *'
    - cron: '41 3 * * *'
    - cron: '19 5 * * *'
  push:
    branches: [main]
    paths: [research_fetcher.py, src/lib/studio-research.ts, .github/workflows/nightly_research.yml]
  workflow_dispatch:
    inputs:
      preview_only:
        type: boolean
        description: Verify the topic mix without replacing the live briefing
        default: false
permissions:
  contents: read
concurrency:
  group: studio-daily-briefing
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: contains(github.event.head_commit.message, '[verify-briefing-writer]') || contains(github.event.head_commit.message, '[verify-health-draft]') || contains(github.event.head_commit.message, '[verify-draft-matrix]')
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -p test_research_fetcher.py
      - name: Verify and rotate the briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL }}
          RESEARCH_DOMAIN: ${{ vars.RESEARCH_DOMAIN }}
          RESEARCH_PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
        run: python research_fetcher.py
      - name: Verify a sourced briefing script without queueing a video
        if: contains(github.event.head_commit.message, '[verify-briefing-writer]') || contains(github.event.head_commit.message, '[verify-health-draft]') || contains(github.event.head_commit.message, '[verify-draft-matrix]')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          STUDIO_SCRIPT_TRACE: '1'
          STUDIO_PUBLIC_FIXTURE_TRACE: '1'
          DRAFT_MATRIX: ${{ contains(github.event.head_commit.message, '[verify-draft-matrix]') }}
          HEALTH_DRAFT_CHECK: ${{ contains(github.event.head_commit.message, '[verify-health-draft]') }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          import httpx

          url = os.environ["NEXT_PUBLIC_SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"apikey": key}
          if not key.startswith("sb_secret_"):
              headers["Authorization"] = "Bearer " + key
          response = httpx.get(url + "/rest/v1/research_ideas", headers=headers, timeout=15,
                              params={"select": "briefing_date,topic_area,title,hook_summary,references", "order": "position", "limit": 3})
          response.raise_for_status()
          ideas = response.json()
          assert {idea["topic_area"] for idea in ideas} == {"health", "education", "intelligence"}
          health_check = os.getenv("HEALTH_DRAFT_CHECK") == "true"
          by_topic = {idea["topic_area"]: idea for idea in ideas}
          fixtures = [(300, "16:9", by_topic["health"])] if health_check else [(720, "16:9", by_topic["education"])]
          if os.getenv("DRAFT_MATRIX") == "true":
              reported_story = {"topic_area": "health", "title": "Gut bacteria and CAR T-cell therapy",
                                "hook_summary": "The lead study examined gut bacteria in a mouse lymphoma model.",
                                "references": ["https://pubmed.ncbi.nlm.nih.gov/42485357/", "https://pubmed.ncbi.nlm.nih.gov/36641624/"]}
              fixtures = [(600, "16:9", reported_story), (60, "9:16", by_topic["education"]),
                          (300, "16:9", by_topic["intelligence"]), (720, "16:9", by_topic["education"])]
          print("Verified briefing date and all three topics:", ideas[0]["briefing_date"], flush=True)
          for target, ratio, lead in fixtures:
              print(f"Checking {lead['topic_area']} at {target}s ({ratio})", flush=True)
              result = subprocess.run(["node", "--experimental-strip-types", "src/lib/studio-daily.ts"],
                                      input=json.dumps(dict(brief="Explain the selected study using its exact findings and limitations.",
                                          seconds=target, ratio=ratio, recent=[], briefing=lead)),
                                      text=True, stdout=subprocess.PIPE, timeout=240, check=True)
              draft = json.loads(result.stdout)
              assert draft["duration_seconds"] == target and draft["format"] == ratio
              assert all(link in draft["description"] for link in lead["references"])
              assert any(1 in scene.get("source_ids", []) for scene in draft["scenes"])
              assert draft.get("community_post")
              count = sum(len(scene["narration"].split()) for scene in draft["scenes"])
              assert count >= target * 1.65
              if target >= 300:
                  ctas = [index for index, scene in enumerate(draft["scenes"])
                          if "like" in scene["narration"].lower() and "subscribe" in scene["narration"].lower()]
                  assert len(ctas) == 1 and 0.25 <= ctas[0] / len(draft["scenes"]) <= 0.65
                  assert sum(bool(scene.get("chapter_title")) for scene in draft["scenes"]) >= 3
              print(f"PASS: {lead['topic_area']} {target // 60}-minute draft, {len(draft['scenes'])} scenes, {count} words, exact source links.", flush=True)
          PYTHON
