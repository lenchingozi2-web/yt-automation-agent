name: LenxiQ Automated YouTube Pipeline
on:
  workflow_dispatch:
    inputs:
      video_topic:
        description: Leave AUTO for a fresh LenxiQ topic
        type: string
        default: AUTO
      channel_niche:
        description: Brand pillars for automatic topics
        type: string
        default: 'LenxiQ: AI in healthcare, learning, building products and human intelligence'
      is_shorts:
        description: Portrait format
        type: boolean
        default: true
  schedule:
    - cron: '17 8,10,12 * * *'
  push:
    branches: [main]
    paths: [studio_automation.py, .github/workflows/daily_video.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: studio-daily-producer
  cancel-in-progress: false
jobs:
  generate-render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Generate into the shared Studio queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_TOPIC: ${{ inputs.video_topic || 'AUTO' }}
          CHANNEL_NICHE: "${{ inputs.channel_niche || 'LenxiQ: AI in healthcare, learning, building products and human intelligence' }}"
          IS_SHORTS: ${{ github.event_name == 'workflow_dispatch' && inputs.is_shorts == false && 'false' || 'true' }}
          STUDIO_OWNER_USER_ID: ${{ vars.STUDIO_OWNER_USER_ID }}
          STUDIO_DAILY_LIMIT: '3'
        run: python studio_automation.py
      - name: Start the render worker immediately
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run studio_worker.yml --ref main
