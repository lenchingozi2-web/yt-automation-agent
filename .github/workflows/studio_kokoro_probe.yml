name: Studio offline Kokoro voice probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [studio_kokoro.py, .github/workflows/studio_kokoro_probe.yml]
permissions:
  contents: read
concurrency:
  group: studio-kokoro-smoke
  cancel-in-progress: false
jobs:
  local-neural-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install local voice dependencies
        run: |
          python3 -m pip install -r requirements-kokoro.txt
          python3 -m pip install -r requirements.txt
      - name: Restore verified Kokoro model
        uses: actions/cache@v4
        with:
          path: .kokoro-models
          key: studio-kokoro-v1-fp16-signed-20260818
      - name: Download and verify licensed public voice model
        run: python3 studio_kokoro.py --prepare
      - name: Install audio verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - name: Generate real offline speech and verify no silence
        run: python3 studio_kokoro.py --smoke
