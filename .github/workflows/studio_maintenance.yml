name: Studio media retention
on:
  workflow_dispatch:
    inputs:
      clear_attention:
        description: Remove the current Needs attention entries and their Studio files
        required: false
        type: boolean
        default: false
      dry_run:
        description: Inspect eligible files without deleting
        required: false
        type: boolean
        default: true
  schedule:
    # 23:00 UTC is midnight in Africa/Lagos.
    - cron: '0 23 * * *'
permissions:
  contents: read
concurrency:
  group: studio-media-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply Studio media retention
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STUDIO_PUBLISHED_PREVIEW_HOURS: '12'
          STUDIO_PUBLISHED_THUMBNAIL_DAYS: '90'
        run: |
          args=()
          if [ "${{ inputs.clear_attention }}" = "true" ]; then
            args+=(--clear-attention)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python studio_maintenance.py "${args[@]}"
