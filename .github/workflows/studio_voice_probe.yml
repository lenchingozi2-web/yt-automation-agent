name: Studio independent voice probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/studio_voice_probe.yml]
permissions:
  contents: read
jobs:
  neural-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare audio validator
        run: |
          if ! command -v ffprobe >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python3 -m pip install requests
      - name: Check independent neural speech without publishing a video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, tempfile
          from pathlib import Path
          from studio_speech_backup import generate
          if not os.getenv("GEMINI_API_KEY"):
              raise SystemExit("No Gemini API key configured: independent fallback is NOT yet verified.")
          with tempfile.TemporaryDirectory() as tmp:
              phrase = "Welcome back. Let's create a clear, natural tutorial that sounds like one presenter."
              boundaries, length = generate(phrase, Path(tmp) / "neural.wav")
              assert 2 < length < 30
              assert " ".join(item[2] for item in boundaries) == phrase
              print("PASS: Independent Gemini TTS returned complete decodable audio and transcript-length caption cues.")
          PY
