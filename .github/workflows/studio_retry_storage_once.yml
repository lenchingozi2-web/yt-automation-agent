name: Studio one-time recovery for storage-constrained phone-agent video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/studio_retry_storage_once.yml
permissions:
  contents: read
  actions: write
jobs:
  requeue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Requeue only the owner's exact storage-failed video
        id: recover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          from studio_maintenance import metadata
          from worker import save_fields
          from datetime import datetime, timezone

          video_id = "dd847330-1d11-4b4e-928b-ce8d41394a0f"
          title = "How I Built an Autonomous AI Agent That Runs a YouTube Automation From My Phone"
          url = os.getenv("SUPABASE_URL") or os.getenv("NEXT_PUBLIC_SUPABASE_URL")
          key = os.getenv("SUPABASE_SERVICE_ROLE_KEY") or os.getenv("SUPABASE_KEY")
          if not url or not key:
              raise RuntimeError("Missing Studio-specific Supabase credentials")
          client = create_client(url, key)
          result = client.table("videos").select("*").eq("id", video_id).limit(1).execute().data or []
          queued = False
          if result:
              row = result[0]
              meta = metadata(row)
              eligible = (row.get("status") == "failed"
                          and row.get("title", "").strip() == title
                          and "storage is nearly full" in str(meta.get("error_message") or "").lower()
                          and not meta.get("publish_approved_at") and not meta.get("youtube_url")
                          and not meta.get("youtube_id") and not meta.get("discard_requested_at"))
              if eligible:
                  updated = (client.table("videos").update({"status": "pending"})
                             .eq("id", video_id).eq("status", "failed").select("*").maybe_single().execute())
                  changed = updated.data
                  if changed:
                      save_fields(client, changed, render_attempts=0, error_message=None,
                                  progress_note="Requeued after storage-pressure recovery update")
                      queued = True
          print("[storage-recovery] requeued:", queued, "video:", video_id, flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("queued=" + ("true" if queued else "false") + "\n")
          PY
      - name: Resume the owner's render using the repaired worker
        if: steps.recover.outputs.queued == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run studio_worker.yml --ref main
