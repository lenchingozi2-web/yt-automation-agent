name: Studio Render Worker
on:
  workflow_dispatch:
  repository_dispatch:
    types: [render_video]
  push:
    branches: [main]
    paths: [worker.py, studio_audio.py, studio_revision.py, studio_publish.py, .github/workflows/studio_worker.yml]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: studio-render-worker
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check queue before installing rendering dependencies
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from studio_publish import credential_version, publication_due

          url = (os.getenv("SUPABASE_URL") or os.getenv("NEXT_PUBLIC_SUPABASE_URL") or "").rstrip("/")
          key = os.getenv("SUPABASE_SERVICE_ROLE_KEY") or os.getenv("SUPABASE_KEY") or ""
          work = True
          if url and key:
              request = Request(url + "/rest/v1/videos?select=*&status=in.(pending,rendering,completed)&order=created_at.desc&limit=100",
                                headers={"apikey": key, "Authorization": "Bearer " + key})
              try:
                  with urlopen(request, timeout=15) as response:
                      rows = json.load(response)
                  version = credential_version()
                  now = datetime.now(timezone.utc)
                  work = any(row.get("status") in ("pending", "rendering") or publication_due(row, version, now)
                             for row in rows)
              except Exception as error:
                  print("Queue probe unavailable; running worker:", type(error).__name__)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("work=" + ("true" if work else "false") + "\n")
          print("Rendering required:", work)
          PY
      - name: Install FFmpeg and fonts
        if: steps.queue.outputs.work == 'true'
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null &&
             ffmpeg -hide_banner -filters | awk '$2 == "subtitles" { found=1 } END { exit !found }' &&
             [ "$(fc-match -f '%{family}' 'DejaVu Sans' 2>/dev/null)" = "DejaVu Sans" ]; then
            echo "FFmpeg, subtitles, and DejaVu Sans are already available."
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install worker dependencies
        if: steps.queue.outputs.work == 'true'
        run: pip install -r requirements.txt
      - name: Drain queued videos and retry pending uploads
        if: steps.queue.outputs.work == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py --drain --max-jobs 3
      - name: Preserve MP4 only when repository is private
        if: always() && github.event.repository.private == true && steps.queue.outputs.work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-mp4-backup
          path: output_run/**/final_video.mp4
          if-no-files-found: ignore
          retention-days: 7
