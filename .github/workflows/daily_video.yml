name: LenxiQ Automated YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      video_topic:
        description: 'Leave as AUTO for LenxiQ AI topic generation, or type a custom topic'
        required: true
        default: 'AUTO'
      channel_niche:
        description: 'LenxiQ Brand Pillars (used when topic is AUTO)'
        required: true
        default: 'LenxiQ Brand: AI impact in Medicine/Health, AI in Learning/Education, Building AI Products & Agents, and Intelligence & Common Sense'
      is_shorts:
        description: 'Render as 9:16 YouTube Short? (true/false)'
        required: true
        default: 'true'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate and Render Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.video_topic || 'AUTO' }}
          CHANNEL_NICHE: ${{ github.event.inputs.channel_niche || 'LenxiQ Brand: AI impact in Medicine/Health, AI in Learning/Education, Building AI Products & Agents, and Intelligence & Common Sense' }}
          IS_SHORTS: ${{ github.event.inputs.is_shorts || 'true' }}
        run: python agent_core.py

      - name: Save Used Topic History to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.txt
          git diff --staged --quiet || git commit -m "chore: log generated LenxiQ video topic"
          git push

      - name: Upload to YouTube (If YOUTUBE_TOKEN_JSON is set)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python upload_youtube.py

      - name: Save Rendered Video as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lenxiq-rendered-video
          path: |
            output_run/final_video.mp4
            output_run/script.json
          retention-days: 7
