name: Studio repair verification
on:
  pull_request:
    paths:
      - 'src/lib/**'
      - 'app/**'
      - 'research_fetcher.py'
      - 'studio_maintenance.py'
      - 'worker.py'
      - 'studio_master.py'
      - 'tests/**'
      - '.github/workflows/studio_verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --experimental-strip-types --test tests/studio.test.ts
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python -m unittest discover -s tests -p test_research_fetcher.py
      - run: PYTHONPATH=. python tests/test_retention.py
      - run: python -m py_compile studio_maintenance.py research_fetcher.py worker.py
      - run: ffmpeg -version
      - run: PYTHONPATH=. python -m unittest discover -s tests -p test_long_preview.py
